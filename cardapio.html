<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Semanal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <!-- Início do Carrossel -->
  <section class="banner-carousel">
    
    <div class="carousel-slide fade active" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFqWv1hbn-oZJzo8rDttCCUAktDybuOgImQTmofxoGLXzawNcHSQIPgEU&s=10');">
      <div class="banner-conteudo">
        <h1>Cardápio Semanal</h1>
        <p>Atualiza toda Terça-feira</p>
      </div>
    </div>

    <div class="carousel-slide fade" style="background-image: url('https://i.ytimg.com/vi/RNrTo8J1LLY/maxresdefault.jpg');">
      <div class="banner-conteudo">
        <h1>Pratos Especiais</h1>
        <p>Confira nossas opções da semana!</p>
      </div>
    </div>

  </section>
  <!-- Fim do Carrossel -->

  <main class="container">
    <nav class="dias-semana">
      <button class="btn-dia active" data-dia="terca">Terça</button>
      <button class="btn-dia" data-dia="quarta">Quarta</button>
      <button class="btn-dia" data-dia="quinta">Quinta</button>
      <button class="btn-dia" data-dia="sexta">Sexta</button>
      <button class="btn-dia" data-dia="sabado">Sábado</button>
      <button class="btn-dia" data-dia="domingo">Domingo</button>
      <button class="btn-dia" data-dia="Segunda">Segunda</button>
    </nav>

    <div class="conteudo">
      <section id="cardapio" class="grid-cardapio"></section>
    </div>

    <a href="index.html" class="voltar">Voltar ao início</a>
  </main>

  <script src="script.js"></script>
</body>
</html>
